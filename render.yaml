# render.yaml — Blueprint de despliegue para Render (https://render.com)

services:
  - type: web
    name: moka-tcg-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
